<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>LinkedIn Sales Automation Demo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
</head>
<body class="bg-light">

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
  <div class="container">
    <a class="navbar-brand" href="#">LinkedIn Automation</a>
    <div>
      <a class="btn btn-light btn-sm me-2" href="#upload">Upload Data</a>
      <a class="btn btn-light btn-sm me-2" href="#scoring">Prospect Scoring</a>
      <a class="btn btn-light btn-sm" href="#messages">Messages & Analytics</a>
    </div>
  </div>
</nav>

<!-- Home -->
<header class="text-center p-5 bg-white shadow-sm">
  <h1>AI-Powered LinkedIn Sales Automation</h1>
  <p class="text-muted">Identify prospects, generate personalized messages, and track performance.</p>
</header>

<div class="container my-5">

  <!-- Upload Files -->
  <section id="upload" class="mb-5">
    <h3>Upload Data</h3>
    <div class="mb-3">
      <label class="form-label">Upload Prospects (CSV)</label>
      <input type="file" id="csvUpload" class="form-control w-50">
    </div>
    <div class="mb-3">
      <label class="form-label">Upload Messages (JSON)</label>
      <input type="file" id="jsonUpload" class="form-control w-50">
    </div>
  </section>

  <!-- Prospect Scoring -->
  <section id="scoring" class="mb-5">
    <h3>Prospect Scoring</h3>
    <table class="table table-striped">
      <thead>
        <tr>
          <th>Name</th>
          <th>Title</th>
          <th>Company</th>
          <th>Score</th>
        </tr>
      </thead>
      <tbody id="prospectTable">
        <!-- Data will load here -->
      </tbody>
    </table>
  </section>

  <!-- Messages & Analytics -->
  <section id="messages">
    <h3>AI Message Generator</h3>
    <div id="messagesContainer">
      <!-- Messages will load here -->
    </div>

    <h3 class="mt-5">Analytics Dashboard</h3>
    <canvas id="analyticsChart" height="100"></canvas>
  </section>

</div>

<script>
  // Handle CSV Upload
  document.getElementById("csvUpload").addEventListener("change", function(event) {
    const file = event.target.files[0];
    if (file) {
      Papa.parse(file, {
        header: true,
        skipEmptyLines: true,
        complete: function(results) {
          const data = results.data;
          let tableBody = document.getElementById("prospectTable");
          tableBody.innerHTML = "";
          data.forEach(row => {
            let tr = document.createElement("tr");
            tr.innerHTML = `
              <td>${row.Name}</td>
              <td>${row.Title}</td>
              <td>${row.Company}</td>
              <td>${row.Score}</td>
            `;
            tableBody.appendChild(tr);
          });
        }
      });
    }
  });

  // Handle JSON Upload
  document.getElementById("jsonUpload").addEventListener("change", function(event) {
    const file = event.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = function(e) {
        const messages = JSON.parse(e.target.result);
        let container = document.getElementById("messagesContainer");
        container.innerHTML = "";
        messages.forEach(msg => {
          let card = document.createElement("div");
          card.className = "card p-3 mb-3";
          card.innerHTML = `
            <p><strong>${msg.Name} (${msg.Title}, ${msg.Company})</strong></p>
            <p>${msg.Message}</p>
          `;
          container.appendChild(card);
        });
      };
      reader.readAsText(file);
    }
  });

  // Analytics Chart
  const ctx = document.getElementById('analyticsChart');
  new Chart(ctx, {
    type: 'bar',
    data: {
      labels: ['Messages Sent', 'Replies', 'Positive Replies', 'Meetings'],
      datasets: [{
        label: 'Demo Data',
        data: [100, 45, 20, 8],
        backgroundColor: ['#007bff','#17a2b8','#28a745','#ffc107']
      }]
    }
  });
</script>

</body>
</html>
